name: Publica projeto de estudante aprovado

# Quando uma submissão feita pelo formulário "Envie seu projeto" recebe a
# etiqueta "aprovado", este workflow monta a pasta do post, baixa o relatório,
# credita quem enviou e abre um pull request com tudo pronto.
#
# Nada vai ao ar sozinho: o site só muda quando alguém mescla esse pull
# request. A etiqueta é a primeira decisão, a mesclagem é a segunda.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  publicar:
    # aceita a etiqueta escrita de qualquer jeito: aprovado, Aprovado, APROVADO
    if: contains(fromJSON('["aprovado","Aprovado","APROVADO"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Prepara Python e Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Guarda os dados da issue
        env:
          ISSUE: ${{ toJSON(github.event.issue) }}
        run: echo "$ISSUE" > issue.json

      - name: Monta a pasta do projeto
        id: montagem
        run: python scripts/publicar_projeto.py issue.json

      - name: Descobre os tipos de contribuição
        id: tipos
        run: python scripts/creditar_submissao.py issue.json

      - name: Credita quem enviou
        env:
          PRIVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOR: ${{ github.event.issue.user.login }}
          TIPOS: ${{ steps.tipos.outputs.tipos }}
        run: |
          IFS=',' read -ra lista <<< "$TIPOS"
          for tipo in "${lista[@]}"; do
            npx --yes all-contributors-cli add "$AUTOR" "$tipo" || true
          done
          python scripts/ordenar_contribuidores.py
          npx --yes all-contributors-cli generate

      - name: Abre o pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.montagem.outputs.slug }}
          TITULO: ${{ steps.montagem.outputs.titulo }}
          CAMINHO: ${{ steps.montagem.outputs.caminho }}
          CAPA: ${{ steps.montagem.outputs.capa }}
          AUTOR: ${{ github.event.issue.user.login }}
          NUM: ${{ github.event.issue.number }}
        run: |
          rm -f issue.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "projeto/$SLUG"
          git add -A
          git commit -m "Publica projeto: $TITULO (issue #$NUM)"
          git push -u origin "projeto/$SLUG"

          if [ "$CAPA" = "nao" ]; then
            aviso="A submissão não trouxe capa. O gerador automático cria uma no próximo render."
          else
            aviso="Capa enviada pelo autor."
          fi

          url=$(gh pr create \
            --base master \
            --head "projeto/$SLUG" \
            --title "Publica projeto: $TITULO" \
            --body "$(printf '%s\n' \
              "Submissão da issue #$NUM, enviada por @$AUTOR." \
              "" \
              "Conteúdo montado automaticamente em \`$CAMINHO\`:" \
              "" \
              "- \`index.qmd\` com título, resumo, autoria e categorias" \
              "- \`relatorios/\` com o material recebido" \
              "- crédito de @$AUTOR na lista de contribuidores" \
              "" \
              "$aviso" \
              "" \
              "Confira o texto e as categorias antes de mesclar. Ao mesclar, o site é republicado e o crédito entra junto." )")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Avisa na issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue comment "$NUM" --body "Projeto aprovado e preparado para publicação: $URL

          Assim que o pull request for mesclado, a página entra no ar e o crédito aparece na lista de contribuidores."

      - name: Se algo falhar, avisa na issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --body "Não consegui montar o projeto automaticamente. Os motivos mais comuns são o link do relatório estar inacessível ou o arquivo não ser .html, .pdf ou .zip. Confira o [registro da execução](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) e, se preferir, publique manualmente seguindo o README."
