name: Credita quem teve a submissão publicada

# Quando uma submissão de software, material, notícia, evento ou edital recebe
# a etiqueta "publicado", quem enviou entra na lista de contribuidores com os
# emojis certos: o do vínculo (docente ou discente) e o da área.
#
# Os projetos de Organização e Apresentação de Dados não passam por aqui:
# eles têm publicação automática em publicar-projeto.yml, que já credita.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  creditar:
    if: >
      github.event.label.name == 'publicado' &&
      !contains(github.event.issue.labels.*.name, 'projeto-estudante')
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Prepara o Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Guarda os dados da issue
        env:
          ISSUE: ${{ toJSON(github.event.issue) }}
        run: echo "$ISSUE" > issue.json

      - name: Descobre os tipos de contribuição
        id: tipos
        run: python scripts/creditar_submissao.py issue.json

      - name: Acrescenta na lista
        env:
          PRIVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOR: ${{ github.event.issue.user.login }}
          TIPOS: ${{ steps.tipos.outputs.tipos }}
        run: |
          IFS=',' read -ra lista <<< "$TIPOS"
          for tipo in "${lista[@]}"; do
            npx --yes all-contributors-cli add "$AUTOR" "$tipo" || true
          done

      - name: Coloca os docentes no topo e regenera a tabela
        run: |
          python scripts/ordenar_contribuidores.py
          npx --yes all-contributors-cli generate

      - name: Publica a atualização
        env:
          AUTOR: ${{ github.event.issue.user.login }}
          TIPOS: ${{ steps.tipos.outputs.tipos }}
        run: |
          rm -f issue.json
          if git diff --quiet; then
            echo "Nada a fazer: a pessoa já constava com esses tipos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .all-contributorsrc
          git commit -m "Credita @$AUTOR ($TIPOS) na lista de contribuidores"
          git push

      - name: Avisa na issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          AUTOR: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment "$NUM" --body "Publicado. @$AUTOR entrou na [lista de contribuidores](https://github.com/${{ github.repository }}#contribuidores). Obrigado pela contribuição."
