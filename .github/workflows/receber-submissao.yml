name: Recebe submissão e abre o pedido de publicação

# A submissão do formulário já chega como pedido de publicação: assim que a
# issue é criada, o robô monta a página na seção escolhida, credita quem
# enviou e abre um pull request.
#
# Sua decisão vira um clique só, na aba Pull requests:
#   Merge  = publica (o site republica sozinho e o crédito entra junto)
#   Close  = recusa
#
# Nada vai ao ar sem esse merge.

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  montar:
    # Reconhece a submissão pelo próprio conteúdo da issue, e não por etiqueta:
    # etiqueta depende de alguém ter criado antes, e o GitHub descarta em
    # silêncio a que não existe. O formulário sempre gera este cabeçalho.
    if: >
      github.event.issue.pull_request == null &&
      (contains(github.event.issue.body, 'Onde isso deve ser publicado') ||
       startsWith(github.event.issue.title, '[Envio]'))
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Configura a identidade do robô
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepara o Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Guarda os dados da issue
        env:
          ISSUE: ${{ toJSON(github.event.issue) }}
        run: echo "$ISSUE" > issue.json

      - name: Monta a página na seção escolhida
        id: montagem
        run: python scripts/publicar_submissao.py issue.json

      - name: Descobre os tipos de contribuição
        id: tipos
        run: python scripts/creditar_submissao.py issue.json

      - name: Credita quem enviou
        env:
          PRIVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOR: ${{ github.event.issue.user.login }}
          TIPOS: ${{ steps.tipos.outputs.tipos }}
        run: |
          python scripts/creditar_contribuidor.py "$AUTOR" "$TIPOS"
          python scripts/ordenar_contribuidores.py
          npx --yes all-contributors-cli generate

      - name: Abre o pedido de publicação
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.montagem.outputs.slug }}
          TITULO: ${{ steps.montagem.outputs.titulo }}
          AREA: ${{ steps.montagem.outputs.area }}
          CAMINHO: ${{ steps.montagem.outputs.caminho }}
          CAPA: ${{ steps.montagem.outputs.capa }}
          AUTOR: ${{ github.event.issue.user.login }}
          NUM: ${{ github.event.issue.number }}
        run: |
          rm -f issue.json
          git checkout -b "envio/$SLUG"
          git add -A
          git commit -m "Publica em $AREA: $TITULO (issue #$NUM)"
          git push -u origin "envio/$SLUG"

          if [ "$CAPA" = "nao" ]; then
            capa="Sem capa enviada: o gerador automático cria uma no próximo render."
          else
            capa="Capa enviada por quem submeteu."
          fi

          url=$(gh pr create \
            --base master \
            --head "envio/$SLUG" \
            --title "[$AREA] $TITULO" \
            --body "$(printf '%s\n' \
              "Submissão da issue #$NUM, enviada por @$AUTOR." \
              "" \
              "**Seção:** $AREA" \
              "**Pasta:** \`$CAMINHO\`" \
              "" \
              "O robô montou a página a partir do modelo da seção e creditou @$AUTOR na lista de contribuidores." \
              "" \
              "$capa" \
              "" \
              "---" \
              "" \
              "**Mesclar** publica no site. **Fechar** recusa a submissão." )")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Avisa na issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue comment "$NUM" --body "Obrigado pelo envio. A página já foi montada e está aguardando revisão da equipe: $URL

          Você recebe um aviso aqui quando ela for publicada."

      - name: Se algo falhar, avisa na issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --body "Não consegui montar a página automaticamente. Os motivos mais comuns são faltar o título ou o resumo, a seção não ter sido escolhida, ou o link do relatório estar inacessível. A equipe vai olhar. [Registro da execução](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
