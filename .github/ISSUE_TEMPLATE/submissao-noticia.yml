name: "📰 Notícia, evento ou edital"
description: "Envie uma manchete, a divulgação de um evento ou um edital do departamento."
title: "[Pauta] Assunto aqui"
labels: ["submissao", "pauta"]
body:
  - type: markdown
    attributes:
      value: |
        Um formulário para as três seções de conteúdo datado do site:
        **Notícias**, **Eventos** e **Oportunidades**. Escolha o tipo abaixo e
        preencha o que fizer sentido.

  - type: dropdown
    id: tipo
    attributes:
      label: "Tipo de publicação"
      options:
        - "Notícia"
        - "Evento"
        - "Edital ou oportunidade"
    validations:
      required: true

  - type: input
    id: titulo
    attributes:
      label: "Título"
      placeholder: "ex.: XVIII Encontro Mineiro de Estatística"
    validations:
      required: true

  - type: input
    id: autor
    attributes:
      label: "Quem assina"
      description: "Como deve aparecer na publicação."
      placeholder: "ex.: Departamento de Estatística da UFLA"
    validations:
      required: true

  - type: dropdown
    id: vinculo
    attributes:
      label: "Seu vínculo com o DES/UFLA"
      description: "Define como você aparece na lista de contribuidores do projeto."
      options:
        - "Docente"
        - "Discente"
        - "Técnico administrativo"
        - "Externo ao DES"
    validations:
      required: true

  - type: input
    id: data
    attributes:
      label: "Data"
      description: "Para evento, a data em que ele acontece. Para notícia ou edital, a data de publicação."
      placeholder: "AAAA-MM-DD"
    validations:
      required: true

  - type: textarea
    id: resumo
    attributes:
      label: "Resumo"
      description: "De 1 a 3 frases. É o texto que aparece no card da página inicial."
    validations:
      required: true

  - type: textarea
    id: texto
    attributes:
      label: "Texto da publicação"
      description: "O conteúdo em si. Pode ser curto: o costume do site é um resumo seguido do link para a fonte oficial."
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: "Link oficial (opcional)"
      description: "Página do DES, do evento ou do edital completo."
      placeholder: "https://des.ufla.br/"
    validations:
      required: false

  - type: textarea
    id: thumbnail
    attributes:
      label: "Imagem de capa (opcional)"
      description: "Arraste uma imagem 16:9 (ideal 1200×675 px). Sem ela, o site gera uma automaticamente."
    validations:
      required: false
