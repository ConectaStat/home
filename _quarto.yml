project:
  type: website
  # O site é renderizado direto na pasta publicada (GitHub Pages serve docs/).
  # Não existe mais _site/ versionado: build é artefato, não fonte.
  output-dir: docs
  # Só arquivos .qmd viram página. Assim o README.md e o TEXTOS.md ficam
  # como documentação do repositório, sem virar página pública do site.
  render:
    - "**/*.qmd"
  # Antes de cada render completo: gera a capa de qualquer post sem `image:`
  # (gráfico/mapa mais colorido do relatório, ou "foto" do topo da notícia).
  pre-render: scripts/gerar_thumbnails.py
  # Depois de cada render:
  #  1) troca o " – " dos títulos das páginas por " | ";
  #  2) refaz o TEXTOS.md, o mapa de textos do site usado na revisão editorial.
  post-render:
    - scripts/ajustar_titulos.py
    - scripts/gerar_textos.py
  # As capas e os relatórios moram dentro da pasta de cada post (page bundle),
  # então o Quarto já os copia junto; aqui ficam só os recursos de site.
  resources:
    - images/

lang: pt

website:
  title: "Conexão Estatística"
  image: images/logo_ufla_transparente.png
  favicon: images/ufla_favicon.ico
  open-graph: true
  site-url: https://conectastat.github.io/home/
  repo-url: https://github.com/ConectaStat/home
  ##
  navbar:
    toggle-position: right
    background: "#0a3f66"
    # Sem o nome do site: só o slogan no topo esquerdo, no mesmo estilo
    # "prompt" da hero (Ciência/ Estatística/ Conexão em fonte mono)
    title: '<span class="nav-tagline"><span>Ciência<span class="tag-barra">/</span></span> <span class="tag-verde">Estatística<span class="tag-barra">/</span></span> <span>Conexão</span></span>'
    collapse-below: lg
    right:
      - text: "Estatística"
        href: estatistica/index.qmd
      - text: "Nossos Cursos"
        menu:
          - text: "Graduação"
            href: cursos/graduacao/index.qmd
          - text: "Pós-Graduação"
            href: cursos/pos-graduacao/index.qmd
      - text: "Projetos"
        menu:
          - text: "Pesquisa"
            href: projetos/pesquisa/index.qmd
          - text: "Ensino"
            href: projetos/ensino/index.qmd
          - text: "Extensão"
            href: projetos/extensao/index.qmd
      - text: "Ações"
        menu:
          - text: "Revista Científica"
            href: acoes/revista-cientifica/index.qmd
          - text: "Assessoria e Consultoria Estatística"
            href: assessoria/index.qmd
          - text: "Eventos"
            href: eventos/index.qmd
  page-navigation: true

  back-to-top-navigation: false

  page-footer:
    background: "#0a3f66"
    left: |
      [Site de projeto vinculado ao Departamento de Estatística da UFLA. Este não é um site institucional da Universidade.]{.footer-disclaimer}
    center:
      - href: https://github.com/ConectaStat/home
        icon: github
        aria-label: GitHub
      - href: "#"
        icon: instagram
        aria-label: Instagram
      - href: "#"
        icon: linkedin
        aria-label: LinkedIn
    right: |
      <div class="footer-assinatura"><div class="footer-des"><span class="footer-des-sigla">DES</span><span class="footer-des-nome">Departamento de<br>Estatística</span></div><a href="https://ufla.br/" aria-label="Universidade Federal de Lavras"><img src="/images/ufla-oficial-negativa.png" class="footer-ufla-logo" alt="Universidade Federal de Lavras"></a></div>

format:
  html:
    theme: [cosmo, _assets/conexao-estatistica.scss]
    css: _assets/conexao-estatistica.css
    include-after-body:
      - _includes/listing-cards.html
      - _includes/transitions.html
    toc: false
    grid:
      sidebar-width: 0px
      body-width: 1050px
      margin-width: 60px

execute:
  freeze: auto
