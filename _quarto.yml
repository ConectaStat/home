project:
  type: website
  # Antes de cada render completo: gera a capa de qualquer post sem `image:`
  # (gráfico/mapa mais colorido do relatório, ou "foto" do topo da notícia).
  pre-render: scripts/gerar_thumbnails.py
  # Depois de cada render: troca o " – " dos títulos das páginas por " | "
  post-render: scripts/ajustar_titulos.py
  resources:
    - images/post-placeholder.svg
    - cursos/graduacao/projetos-estudantes/relatorios/
    - cursos/graduacao/projetos-estudantes/thumbnails/
    - noticias/thumbnails/
    - oportunidades/thumbnails/
    - eventos/thumbnails/

lang: pt

website:
  title: "Conexão Estatística"
  image: images/logo_ufla_transparente.png
  favicon: images/ufla_favicon.ico
  open-graph: true
  site-url: https://conectastat.github.io/home/
  repo-url: https://github.com/ConectaStat/home
  ##
  navbar:
    toggle-position: right
    background: "#0a3f66"
    logo: images/logo-conexao.png
    logo-alt: "Marca do Conexão Estatística"
    title: 'Conexão Estatística<span class="nav-dot">.</span><span class="nav-tagline"><span>Ciência,</span> <span class="tag-verde">Estatística &amp;</span> <span>Conexão</span></span>'
    collapse-below: lg
    right:
      - text: "Estatística"
        href: estatistica/index.qmd
      - text: "Nossos Cursos"
        menu:
          - text: "Graduação"
            href: cursos/graduacao/index.qmd
          - text: "› Sobre o curso"
            href: cursos/graduacao/index.qmd
          - text: "› Projetos dos Estudantes"
            href: cursos/graduacao/projetos-estudantes/index.qmd
          - text: "Pós-Graduação"
            href: cursos/pos-graduacao/index.qmd
          - text: "› Sobre o curso"
            href: cursos/pos-graduacao/index.qmd
          - text: "› Painel dos Egressos"
            href: cursos/pos-graduacao/egressos/index.qmd
      - text: "Assessoria e Consultoria"
        href: assessoria/index.qmd
      - text: "Projetos"
        menu:
          - text: "Pesquisa"
            href: projetos/pesquisa/index.qmd
          - text: "Ensino"
            href: projetos/ensino/index.qmd
          - text: "Extensão"
            href: projetos/extensao/index.qmd
      - text: "Ações"
        menu:
          - text: "Revista Científica"
            href: acoes/revista-cientifica/index.qmd
          - text: "Núcleos de Estudo"
            href: acoes/nucleos-de-estudo/index.qmd
          - text: "› NLIN"
            href: acoes/nucleos-de-estudo/nlin/index.qmd
          - text: "› GPS"
            href: acoes/nucleos-de-estudo/gps/index.qmd
          - text: "› ST"
            href: acoes/nucleos-de-estudo/st/index.qmd
  page-navigation: true

  back-to-top-navigation: false

  page-footer:
    background: "#0a3f66"
    left: |
      Copyright &copy; 2026 **Conexão Estatística**

      [Site de projeto vinculado ao Departamento de Estatística da UFLA. Este não é um site institucional da Universidade.]{.footer-disclaimer}
    center:
      - href: https://github.com/ConectaStat/home
        icon: github
        aria-label: GitHub
      - href: "#"
        icon: instagram
        aria-label: Instagram
      - href: "#"
        icon: linkedin
        aria-label: LinkedIn
    right: |
      <div class="footer-assinatura"><div class="footer-des"><span class="footer-des-sigla">DES</span><span class="footer-des-nome">Departamento de<br>Estatística</span></div><a href="https://ufla.br/" aria-label="Universidade Federal de Lavras"><img src="/images/ufla-oficial-negativa.png" class="footer-ufla-logo" alt="Universidade Federal de Lavras"></a></div>

format:
  html:
    theme: [cosmo, conectastat.scss]
    css: conectastat.css
    include-after-body:
      - _includes/listing-cards.html
      - _includes/transitions.html
    toc: false
    grid:
      sidebar-width: 0px
      body-width: 1050px
      margin-width: 60px

execute:
  freeze: auto
