<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-label="ConectaStat: histograma com a curva normal ajustada">
  <!-- Capa padrão de Notícias, Oportunidades e Eventos (posts sem capa própria).
       Mesmo desenho da capa-padrao.svg, em negativo sobre o $cs-blue-dark
       #0a3f66 da barra do topo e do rodapé. As demais seções usam a versão de
       fundo branco. Proporção 16:9, igual à dos cards. -->
  <rect width="1200" height="675" fill="#0a3f66"/>

  <g fill="none" stroke="#ffffff">
    <line x1="120" y1="560" x2="1080" y2="560" stroke-width="3" stroke-opacity=".45"/>
    <g stroke-width="3" stroke-opacity=".35">
      <rect x="200" y="500" width="100" height="60"/>
      <rect x="308" y="410" width="100" height="150"/>
      <rect x="416" y="270" width="100" height="290"/>
      <rect x="524" y="180" width="100" height="380"/>
      <rect x="632" y="260" width="100" height="300"/>
      <rect x="740" y="400" width="100" height="160"/>
      <rect x="848" y="490" width="100" height="70"/>
    </g>
    <path stroke="#1a8a4c" stroke-width="5" stroke-linecap="round"
          d="M150,552 C330,545 400,470 480,300 C530,195 560,152 574,152
             C590,152 620,202 670,305 C750,470 830,545 1050,552"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="40"
     font-weight="800" letter-spacing="-1.4">
    <text x="120" y="122" fill="#ffffff">Ciência<tspan fill="#ffffff" fill-opacity=".55">|</tspan></text>
    <text x="120" y="168" fill="#1a8a4c">Estatística<tspan fill="#ffffff" fill-opacity=".55">|</tspan></text>
    <text x="120" y="214" fill="#ffffff">Sociedade</text>
  </g>
</svg>
