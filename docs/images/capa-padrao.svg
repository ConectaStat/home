<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-label="Conexão Estatística: histograma com a curva normal ajustada">
  <!-- Capa padrão dos posts sem imagem própria (image-placeholder das listagens).
       Mesma linguagem dos 17 gráficos dos banners (mapa $cs-banners no SCSS):
       linha fina, $cs-blue #0d5488 nos dados e no eixo, $cs-green #1a8a4c só no
       elemento de destaque. Desenho: histograma com a curva normal ajustada,
       o mesmo do banner padrão. Proporção 16:9, igual à dos cards. -->
  <rect width="1200" height="675" fill="#ffffff"/>

  <g fill="none" stroke="#0d5488">
    <line x1="120" y1="560" x2="1080" y2="560" stroke-width="3" stroke-opacity=".75"/>
    <g stroke-width="3" stroke-opacity=".6">
      <rect x="200" y="500" width="100" height="60"/>
      <rect x="308" y="410" width="100" height="150"/>
      <rect x="416" y="270" width="100" height="290"/>
      <rect x="524" y="180" width="100" height="380"/>
      <rect x="632" y="260" width="100" height="300"/>
      <rect x="740" y="400" width="100" height="160"/>
      <rect x="848" y="490" width="100" height="70"/>
    </g>
    <path stroke="#1a8a4c" stroke-width="5" stroke-linecap="round"
          d="M150,552 C330,545 400,470 480,300 C530,195 560,152 574,152
             C590,152 620,202 670,305 C750,470 830,545 1050,552"/>
  </g>

  <!-- Slogan no mesmo desenho do topo e da hero. Sem webfont: dentro de um
       <img> o SVG não carrega a Inter, então a pilha cai no Segoe UI / SF,
       que é o mesmo desenho. -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="40"
     font-weight="800" letter-spacing="-1.4">
    <text x="120" y="122" fill="#0d5488">Ciência<tspan fill="#64707c">/</tspan></text>
    <text x="120" y="168" fill="#1a8a4c">Estatística<tspan fill="#64707c">/</tspan></text>
    <text x="120" y="214" fill="#0d5488">Conexão</text>
  </g>
</svg>
